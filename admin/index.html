<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termômetro Cabana — Administração</title>
<link rel="stylesheet" href="../style.css">
<style>
body{background:#f5f3ee}.admin{max-width:1200px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:25px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.tab{padding:10px 15px;border:1px solid #d9e1dd;border-radius:10px;background:white;cursor:pointer}.tab.active{background:#174f43;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:#fff;border:1px solid #e2e7e4;border-radius:16px;padding:18px}.metric small{display:block}.metric strong{font-size:30px;display:block;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel h2{margin-top:0}.barrow{margin:14px 0}.barhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.track{height:12px;background:#edf1ef;border-radius:20px;overflow:hidden}.fill{height:100%;background:#174f43;border-radius:20px}.sector{display:grid;grid-template-columns:230px 1fr 70px 90px;gap:12px;align-items:center;margin:12px 0}.login{max-width:420px;margin:18vh auto;background:#fff;padding:30px;border-radius:18px}.login input{width:100%;padding:13px;margin:10px 0;border:1px solid #ccd7d2;border-radius:10px}.hidden{display:none!important}@media(max-width:800px){.cards,.grid2{grid-template-columns:1fr 1fr}.sector{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards,.grid2{grid-template-columns:1fr}.sector{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
<h1>Termômetro Cabana</h1><p>Área administrativa</p>
<input id="email" type="email" placeholder="E-mail do administrador">
<input id="password" type="password" placeholder="Senha">
<button id="loginBtn" class="primary">ENTRAR</button>
<p id="loginMsg" class="muted"></p>
</div>

<div id="app" class="admin hidden">
<header><div><div class="brand">Termômetro Cabana</div><div class="muted">Dashboard de clima organizacional</div></div><button id="logout" class="secondary" style="width:auto;margin:0">Sair</button></header>
<div class="tabs">
<button class="tab active" data-period="today">Hoje</button>
<button class="tab" data-period="7">7 dias</button>
<button class="tab" data-period="30">30 dias</button>
<button class="tab" data-period="90">90 dias</button>
</div>
<section class="cards">
<div class="metric"><small>Índice geral</small><strong id="overall">—</strong><small id="nTotal">0 respostas</small></div>
<div class="metric"><small>Clima positivo</small><strong id="positive">0%</strong><small id="nPositive">0 respostas</small></div>
<div class="metric"><small>Clima neutro</small><strong id="neutral">0%</strong><small id="nNeutral">0 respostas</small></div>
<div class="metric"><small>Clima negativo</small><strong id="negative">0%</strong><small id="nNegative">0 respostas</small></div>
</section>
<div class="grid2">
<section class="panel"><h2>Clima geral</h2><div id="generalBars"></div></section>
<section class="panel"><h2>Distribuição geral</h2><div id="distribution"></div></section>
</div>
<section class="panel" style="margin-top:16px"><h2>Clima por setor</h2><div id="sectors"></div></section>
<div class="grid2">
<section class="panel"><h2>Principais fatores</h2><div id="reasons"></div></section>
<section class="panel"><h2>Atenção gerencial</h2><div id="alerts"></div></section>
</div>
</div>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
